hypotheses:
  - name: "pulmonary_embolism"
    category: "Pulmonology"
    description: "Blood clot in the lungs"
    required_findings:
      - "shortness of breath"
      - "dyspnea"
    supporting_findings:
      - "hypoxia"
      - "tachycardia"
      - "tachypnea"
      - "hemoptysis"
      - "chest pain"
    contradicting_findings:
      - "wheezing"
      - "relieved by bronchodilator"
      - "known asthma"
    risk_factors:
      - "recent surgery"
      - "cancer"
      - "pregnancy"
      - "immobility"
      - "history of dvt"
    urgency: "high"
    base_score: 0.7

