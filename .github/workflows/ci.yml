name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull_request runs (older head SHAs of the same PR) may be
# cancelled. Pushes to main get a unique group per run, so a running
# main validation is never queued behind or cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Ruff
        run: uvx ruff check .

  black:
    name: Black (24.10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Black
        run: uvx black==24.10.0 --diff --check .

  tests:
    name: Tests (Python 3.12, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: micky_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d micky_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ROP_APP_NAME: "Micky AI CI"
      ROP_ENVIRONMENT: testing
      ROP_LOG_LEVEL: INFO
      ROP_STARTUP_RECOVERY_ENABLED: "false"
      ROP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/micky_ai_test
      ROP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/micky_ai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Apply migrations to the disposable PostgreSQL database
        run: uv run alembic upgrade head

      - name: Run full test suite and report skipped cases
        run: uv run pytest tests -q -ra
