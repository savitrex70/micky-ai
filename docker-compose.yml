services:
  api:
    build: .
    env_file:
      - .env
    environment:
      ROP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rop}:${POSTGRES_PASSWORD:-rop}@db:5432/${POSTGRES_DB:-rop}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rop}
      POSTGRES_USER: ${POSTGRES_USER:-rop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rop}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
